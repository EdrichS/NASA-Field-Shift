# Tool settings only (ruff, pytest). Backend dependencies live in backend/requirements.txt.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "scripts"]
